<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" font-family="'Segoe UI',Ubuntu,Sans-Serif"><style>.q{font-size:18px;font-style:italic;fill:#E6EDF3}.a{font-size:14px;font-weight:700;fill:#FFB454}.n{font-size:10px;fill:#7D8590}.fade{animation:fade 1.2s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}</style><rect x="0.5" y="0.5" width="839" height="169" rx="10" fill="#0D1117" stroke="#30363D"/><rect x="1" y="12" width="3" height="146" rx="1.5" fill="#F74C00" opacity="0.9"/><text x="30" y="88" font-size="72" font-weight="700" fill="#F74C00" opacity="0.85" font-family="Georgia,serif">&#8220;</text><g class="fade"><text x="95" y="62" class="q">It always seems impossible until it's done.</text><text x="810" y="102" text-anchor="end" class="a">— Nelson Mandela</text></g><text x="95" y="152" class="n">daily fuel · a new quote every day, delivered by the live pipeline</text></svg>